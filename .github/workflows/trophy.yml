name: Generate trophy card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths-ignore:
    - "README.md"
    - "assets/**"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # GITHUB_TOKEN is an integration token: the GraphQL user query returns
      # null fields (contributions, organizations...) and the action crashes.
      - name: check STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::STATS_TOKEN secret is missing. Create a classic PAT with read:user and repo scopes and save it as STATS_TOKEN."
            exit 1
          fi

      - name: generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.STATS_TOKEN }}
          theme: dark_dimmed
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: true
          no-frame: true

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}