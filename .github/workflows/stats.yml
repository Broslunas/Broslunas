name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths-ignore:
    - "README.md"
    - "assets/**"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # GITHUB_TOKEN is an integration token: the GraphQL user query fails with
      # "Resource not accessible by integration" and the error card gets published.
      - name: check STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::STATS_TOKEN secret is missing. Create a classic PAT with read:user and repo scopes and save it as STATS_TOKEN."
            exit 1
          fi

      - name: generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&locale=es&bg_color=00000000&title_color=ff5a1f&text_color=eaeaea&icon_color=ff5a1f&ring_color=ff5a1f&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.STATS_TOKEN }}


      # Keep the last good card instead of publishing an error card.
      - name: validate stats.svg
        run: |
          if grep -q "Something went wrong" dist/stats.svg; then
            grep -o '<tspan[^>]*>[^<]*</tspan>' dist/stats.svg | sed 's/<[^>]*>//g'
            echo "::error::github-readme-stats returned an error card (check STATS_TOKEN scopes/expiry)."
            exit 1
          fi

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}